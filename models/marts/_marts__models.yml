version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]

      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id



      - name: order_date
        description: "Дата заказа."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

                

      - name: ordered_at
        description: "Время оформления заказа."

      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."

      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
        data_tests: [non_negative]

      - name: items_count #  новый мой
        description: "Количество разных товаров в заказе." #

      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
        data_tests: [non_negative]

      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."

      - name: net_paid_amount
        description: "Оплачено минус возвращено."

      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."

      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."

      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
        data_tests: [not_null]


  # Новую витрину описываю позиций заказов, проверяю, что у каждой позиции укикал айди \\\\\\\\\
  - name: fct_order_items
    description: "Позиции заказов без тестовых. Одна строка - один товар в заказе."
    columns:
      - name: order_item_id
        description: "Уникальный идентификатор позиции заказа."
        data_tests: [unique, not_null]

      - name: order_id
        description: "ID заказа, к которому относится товар"
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: product_id
        description: "ID товара"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        description: "ID покупателя"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: "Дата cоздания заказа"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day


      - name: quantity
        description: "Количество единиц товара"

      - name: unit_price
        description: "Цена одной единицы товара"

      - name: discount_amount
        description: "Сумма скидки на позицию заказа"

      - name: line_amount
        description: "Итоговая стоимость позиции с учётом скидки"

      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"


  # нью витрина покупателей и тех кто ниче не купил
  - name: dim_customers
    description: "Все клиенты магазина, их подтверждённые покупки и общая выручка."
    columns:
      - name: customer_id
        description: "ID клиента"
        data_tests: [unique, not_null]

      - name: registered_at
        description: "Дата и время регистрации клиента"

      - name: registration_date
        description: "Дата регистрации без времени"

      - name: city
        description: "Город клиента"

      - name: acquisition_channel
        description: "Канал привлечения клиента"

      - name: first_confirmed_order_id
        description: "ID первого подтверждённого заказа"

      - name: first_confirmed_at
        description: "Дата и время первого подтверждённого заказа"

      - name: confirmed_orders_count
        description: "Количество подтверждённых заказов"

      - name: confirmed_revenue
        description: "Общая сумма подтверждённых покупок в рублях"

      - name: is_buyer
        description: "Есть ли у клиента хотя бы одна подтверждённая покупка"


  # Витрина товаров с категориями и их родителями
  - name: dim_products
    description: "Товары магазина с брендами и иерархией категорий."
    columns:


      #д
      - name: product_hash
        description: "Хеш-ключ товара, созданный с помощью dbt_utils из product_id"



      - name: product_id
        description: "ID товара"
        data_tests: [unique, not_null]

      - name: product_name
        description: "Название товара"

      - name: brand
        description: "Бренд товара"

      - name: category_name
        description: "Категория товара"

      - name: parent_category_name
        description: "Родительская категория"

      - name: root_category_name
        description: "Самая верхняя категория товара"


    # Календарь для анализа продаж по датам
  - name: dim_dates
    description: "Календарь всех дат от первого до последнего заказа."
    columns:
      - name: date_day
        description: "Дата"
        data_tests: [unique, not_null]

      - name: year
        description: "Год"

      - name: quarter
        description: "Квартал"

      - name: month
        description: "Месяц"

      - name: day_of_week
        description: "Номер дня недели"

      - name: is_weekend
        description: "Признак выходного дня"